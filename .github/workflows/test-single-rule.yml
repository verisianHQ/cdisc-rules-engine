name: Test Single Rule for Contributor Repo

on:
  workflow_dispatch:
    inputs:
      rule_data:
        description: "JSON containing rule YAML, test data, and define.xml"
        required: true
        type: string

jobs:
  test-rule:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coredb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout cdisc-rules-engine
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Parse rule data
        id: parse_rule
        run: |
          echo '${{ inputs.rule_data }}' > /tmp/rule_data.json

          # Extract rule ID
          RULE_ID=$(python3 -c "import json; data=json.load(open('/tmp/rule_data.json')); print(data['rule_id'])")
          echo "rule_id=$RULE_ID" >> $GITHUB_OUTPUT
          echo "Rule ID: $RULE_ID"

      - name: Prepare test structure
        run: |
          # Create directory structure that matches regression test expectations
          mkdir -p /tmp/test_root/${{ steps.parse_rule.outputs.rule_id }}/positive
          mkdir -p /tmp/test_root/${{ steps.parse_rule.outputs.rule_id }}/negative
          mkdir -p /tmp/results

      - name: Extract test data from JSON
        run: |
          python3 << 'EOF'
          import json
          import base64
          from pathlib import Path

          with open('/tmp/rule_data.json', 'r') as f:
              rule_data = json.load(f)

          rule_id = rule_data['rule_id']

          for test_type in ['positive', 'negative']:
              test_cases = rule_data['test_data'].get(test_type, [])
              
              for test_case in test_cases:
                  case_id = test_case['case_id']
                  filename = test_case['filename']
                  content = base64.b64decode(test_case['content'])
                  
                  # Structure: /{rule_id}/{positive|negative}/{case_id}/data/test_data.xlsx
                  case_dir = Path(f'/tmp/test_root/{rule_id}/{test_type}/{case_id}/data')
                  case_dir.mkdir(parents=True, exist_ok=True)
                  
                  excel_path = case_dir / filename
                  with open(excel_path, 'wb') as f:
                      f.write(content)
                  
                  print(f"Saved {test_type} test case: {case_id}/{filename}")
                  
                  if rule_data.get('define_xml'):
                      define_path = case_dir / 'define.xml'
                      with open(define_path, 'w') as f:
                          f.write(rule_data['define_xml'])
                      print(f"Saved define.xml for {test_type}/{case_id}")

          print(f"\nTest data structure prepared for {rule_id}")
          EOF

      - name: Run regression test using existing code
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: coredb
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REGRESSION_PATH: /tmp/test_root
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.getcwd())

          from tests.resources.rule_regression.regression import (
              run_test_cases,
              sharepoint_xlsx_to_test_datasets,
              find_data_file,
              find_define_xml_file_path,
              process_test_case_dataset,
              get_metadata,
              extract_results_regression,
              extract_overall_result
          )
          from cdisc_rules_engine.utilities.ig_specification import IGSpecification
          from scripts.script_utils import get_rules_cache

          # Load rule data
          with open('/tmp/rule_data.json', 'r') as f:
              rule_data = json.load(f)

          rule_id = rule_data['rule_id']

          # Get the rule from cache
          rules_cache = get_rules_cache()
          rule = rules_cache.get(rule_id)

          if not rule:
              print(f"Error: Rule {rule_id} not found in cache")
              sys.exit(1)

          ig_specs = {
              "standard": "sdtmig",
              "standard_version": "3-4",
              "standard_substandard": None,
              "define_xml_version": None,
          }

          final_results = {
              "rule_id": rule_id,
              "status": "passed",
              "positive_tests": [],
              "negative_tests": []
          }

          for test_type in ['positive', 'negative']:
              test_type_path = Path(f'/tmp/test_root/{rule_id}/{test_type}')
              
              if not test_type_path.exists():
                  continue
              
              # Get all test case directories
              test_cases = sorted([d for d in test_type_path.iterdir() if d.is_dir()])
              
              for test_case_dir in test_cases:
                  case_id = test_case_dir.name
                  data_dir = test_case_dir / 'data'
                  
                  print(f"Running {test_type} test case: {case_id}")
                  
                  try:
                      # Find test data file
                      test_data_file = find_data_file(str(data_dir))
                      if not test_data_file:
                          print(f"No test data file found in {data_dir}")
                          final_results[f"{test_type}_tests"].append({
                              "case_id": case_id,
                              "passed": False,
                              "errors": ["No test data file found"]
                          })
                          continue
                      
                      # Find define.xml
                      define_xml_file = find_define_xml_file_path(str(data_dir))
                      
                      test_datasets = sharepoint_xlsx_to_test_datasets(test_data_file)
                      
                      # Run validation using existing regression code
                      regression_errors = {}
                      process_test_case_dataset(
                          regression_errors,
                          define_xml_file,
                          test_datasets,
                          ig_specs,
                          rule,
                          str(test_case_dir),
                          rule_id
                      )
                      
                      # Extract SQL engine results
                      sql_results = regression_errors.get('results_sql', [])
                      overall_status = regression_errors.get('sql_overall_result', 'unknown')
                      
                      print(f"Overall status: {overall_status}")
                      
                      # Determine if test passed based on expectations
                      if test_type == 'positive':
                          # Positive tests should have NO errors
                          total_errors = sum(r['number_errors'] for r in sql_results)
                          passed = (total_errors == 0 and overall_status == 'success')
                      else:
                          # Negative tests should have AT LEAST ONE error
                          total_errors = sum(r['number_errors'] for r in sql_results)
                          passed = (total_errors > 0 and overall_status == 'success')
                      
                      # Collect error details
                      error_details = []
                      for result in sql_results:
                          if result.get('errors'):
                              error_details.extend([
                                  f"{result['dataset']}: {err}" 
                                  for err in result['errors'][:3]
                              ])
                      
                      final_results[f"{test_type}_tests"].append({
                          "case_id": case_id,
                          "passed": passed,
                          "total_errors": total_errors,
                          "overall_status": overall_status,
                          "errors": error_details[:10]  # First 10 errors
                      })
                      
                      if not passed:
                          final_results['status'] = 'failed'
                      
                      print(f"Test case {case_id}: {'PASSED' if passed else 'FAILED'}")
                      
                  except Exception as e:
                      print(f"Error processing test case {case_id}: {e}")
                      import traceback
                      traceback.print_exc()
                      final_results[f"{test_type}_tests"].append({
                          "case_id": case_id,
                          "passed": False,
                          "errors": [str(e)]
                      })
                      final_results['status'] = 'failed'

          with open('/tmp/results.json', 'w') as f:
              json.dump(final_results, f, indent=2)

          print(f"Final Results for {rule_id}")
          print(f"Status: {final_results['status']}")
          print(f"Positive tests: {len(final_results['positive_tests'])} cases")
          print(f"Negative tests: {len(final_results['negative_tests'])} cases")

          if final_results['status'] == 'failed':
              sys.exit(1)

          EOF

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: /tmp/results.json
          retention-days: 30

      - name: Upload test data structure (for debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-data-structure
          path: /tmp/test_root/
          retention-days: 7

      - name: Check test status
        run: |
          if [ -f "/tmp/results.json" ]; then
            STATUS=$(python3 -c "import json; print(json.load(open('/tmp/results.json'))['status'])")
            
            if [ "$STATUS" = "failed" ]; then
              echo "Tests failed"
              exit 1
            else
              echo "All tests passed"
            fi
          else
            echo "Results file not found"
            exit 1
          fi
