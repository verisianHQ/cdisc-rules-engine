# Variable: AVISIT
# Rule: Subject does not have all visit entries
# verified
Authorities:
  - Organization: CDISC
    Standards:
      - Name: ADaMIG
        References:
          - Citations:
              - Cited Guidance: Custom Rule
                Document: Custom Rule
                Item: Custom Rule
                Section: Custom Rule
            Origin: ADaM Conformance Rules
            Rule Identifier:
              Id: "111"
              Version: "2"
            Version: "5.0"
        Version: "1.3"
Check:
  all:
    - name: '^(?P<root>.*)(?P<number>\d+)FL$'
      variable_regex_pattern: true
      operator: not_equal_to
      value: "{{root}}"
    - name: "{{root}}{{number}}"
      operator: exists
    - name: "AGEGR{{number}}"
      operator: equal_to
      value: "<55 YEARS"
Core:
  Id: Testing Custom Rule | Regex Test 3
  Status: Draft
  Version: "1"
Description: Test var exists
Executability: Fully Executable
Outcome:
  Message: Test var exists
  Output Variables:
    - "{{root}}{{number}}"
    - "{{root}}{{number}}FL"
    - "AGEGR{{number}}"
Rule Type: Record Data
Scope:
  Data Structures:
    Include:
      - BDS
  Domains:
    Include:
      - ADEG
      - ADVS
      - ADEF
Sensitivity: Record
